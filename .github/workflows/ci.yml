name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rust: ["1.85", stable]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
      - run: cargo test --locked
      - run: cargo test --locked --release
      - run: cargo test --locked --no-default-features
      - run: cargo test --locked --no-default-features --features alloc
      - run: cargo package --locked
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: riscv32imafc-unknown-none-elf
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo doc --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      - run: cargo check --no-default-features --target riscv32imafc-unknown-none-elf --lib
      - run: cargo check --no-default-features --features alloc --target riscv32imafc-unknown-none-elf --lib
