[package]
name = "bcd_time_stamp"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Dependency-free, no_std BCD clock times and typed second/millisecond timestamps"
license = "LGPL-3.0-or-later"
readme = "README.md"
authors = ["netsalmon@disroot.org"]
keywords = ["bcd", "time", "timestamp", "embedded", "no-std"]
categories = ["date-and-time", "embedded", "no-std"]
include = ["src/**", "tests/**", "examples/**", "Cargo.toml", "README.md", "LICENSE", "COPYING", "CHANGELOG.md"]

[features]
default = ["std", "alloc"]
std = ["alloc"]
alloc = []

[dependencies]
